query GetFileValidationIssues {
  fileValidationIssues {
    blocking {
      count
      items {
        id
        rowNumber
        title
        columnName
        validationType
        fileId
        fileName
      }
    }
    warning {
      count
      items {
        id
        rowNumber
        title
        columnName
        validationType
        fileId
        fileName
      }
    }
    fyi {
      count
      items {
        id
        rowNumber
        title
        columnName
        validationType
        fileId
        fileName
      }
    }
  }
}
